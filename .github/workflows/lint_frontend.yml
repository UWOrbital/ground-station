lint-frontend:
  runs-on: ubuntu-latest
  strategy:
    matrix:
      app: [aro, mcc]
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dir: frontend/${{ matrix.app }}
    - run: npm ci
      working-directory: frontend/${{ matrix.app }}
    - run: npm run lint
      working-directory: frontend/${{ matrix.app }}
    - run: npx prettier --check .
      working-directory: frontend/${{ matrix.app }}
