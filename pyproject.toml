[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "backend"
version = "1.0.0"
description = "All backend code used by UW Orbital's GS subteam"
requires-python = ">=3.12"

dependencies = [
    # web framework and API
    "fastapi[standard]==0.136.3",
    "fastapi-cache2==0.2.2",
    # database
    "sqlmodel==0.0.38",
    "alembic==1.18.4",
    "asyncpg==0.30.0",
    "greenlet==3.2.4",
    # settings
    "pydantic-settings==2.14.1",
    # security
    "itsdangerous==2.2.0",
    "python-keycloak==7.1.1",
    "fastapi-users==15.0.5",
    # utilities
    "loguru>=0.7.3",
    "pydantic-extra-types>=2.11.0",
    "phonenumbers>=9.0.0",
    "fastapi-mail>=1.6.5",
]

[project.optional-dependencies]
dev = [
    # testing
    "pytest==9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov==7.1.0",
    "testcontainers>=4.14.2",
    # static checking
    "mypy==2.1.0",
    "ruff==0.15.15",
    # tooling
    "pre-commit==4.6.0",
]

[tool.hatch.build.targets]
wheel.packages = ["backend"]
sdist.only-include = ["backend"]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: marks tests that depend on external services or large workloads",
]

[tool.mypy]
exclude = ["backend/tests/*", "backend/migrations/*"]
strict = true
plugins = "pydantic.mypy"

[[tool.mypy.overrides]]
module = ["jwcrypto.*"]
ignore_missing_imports = true
